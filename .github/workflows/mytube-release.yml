# наша сборка: выпуск MyTube по тегу.
# Тег = versionName из app/build.gradle.kts, например 32.1-mytube.1
#   git tag -a 32.1-mytube.1 -m "что нового" && git push origin 32.1-mytube.1
# Ключ подписи — только в секретах репозитория (MYTUBE_KEYSTORE_B64, MYTUBE_KEYSTORE_PASSWORD,
# MYTUBE_KEY_ALIAS); PKCS12, пароль ключа совпадает с паролем хранилища.
name: MyTube release

on:
  push:
    tags:
      - '*-mytube.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_B64: ${{ secrets.MYTUBE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MYTUBE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYTUBE_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mytube.jks"
          {
            echo "storeFile=$RUNNER_TEMP/mytube.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Сборка
        run: ./gradlew assembleRelease --no-daemon

      - name: Проверка версии и подписи
        id: apk
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          NAME=$("$BT/aapt2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          PKG=$("$BT/aapt2" dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p")
          echo "applicationId=$PKG versionName=$NAME tag=$GITHUB_REF_NAME"
          [ "$NAME" = "$GITHUB_REF_NAME" ] || { echo "::error::Тег $GITHUB_REF_NAME не равен versionName $NAME"; exit 1; }
          "$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-256" | tee cert.txt
          grep -qi "e166b55d01aa355d1c7558b09dc35928154ab1ac5f91fd02d55d8e97f29bd69b" cert.txt \
            || { echo "::error::APK подписан не ключом MyTube"; exit 1; }
          mv "$APK" "MyTube-$NAME.apk"
          echo "file=MyTube-$NAME.apk" >> "$GITHUB_OUTPUT"

      - name: Выпуск на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --latest
